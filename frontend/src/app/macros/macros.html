<p>macros works!</p>
<section id="macros" class="section" aria-labelledby="macrosTitle">
    <div class="container">
        <h2 id="macrosTitle" class="section-title" data-aos="fade-up">Mide tus macros</h2>
        <div class="row g-4 align-items-start">
            <div class="col-lg-6" data-aos="fade-right">
                <div class="glass">
                    <form id="macrosForm" novalidate>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label small text-muted" for="sex">Sexo</label>
                                <select id="sex" class="form-control" required>
                                    <option value="male">Hombre</option>
                                    <option value="female">Mujer</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted" for="goal">Objetivo</label>
                                <select id="goal" class="form-control">
                                    <option value="maintain">Mantener</option>
                                    <option value="loss">Perder</option>
                                    <option value="gain">Ganar</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mt-3">
                            <div class="col-4">
                                <label class="form-label small text-muted" for="age">Edad</label>
                                <input id="age" class="form-control" type="number" placeholder="Años" min="10" max="120"
                                    required>
                            </div>
                            <div class="col-4">
                                <label class="form-label small text-muted" for="weight">Peso (kg)</label>
                                <input id="weight" class="form-control" type="number" placeholder="kg" step="0.1"
                                    required>
                            </div>
                            <div class="col-4">
                                <label class="form-label small text-muted" for="height">Altura (cm)</label>
                                <input id="height" class="form-control" type="number" placeholder="cm" min="50"
                                    max="250" required>
                            </div>
                        </div>

                        <div class="row g-2 mt-3">
                            <div class="col-12">
                                <label class="form-label small text-muted" for="activity">Nivel de actividad</label>
                                <select id="activity" class="form-control">
                                    <option value="1.2">Sedentario</option>
                                    <option value="1.375">Ligero</option>
                                    <option value="1.55" selected>Moderado</option>
                                    <option value="1.725">Activo</option>
                                    <option value="1.9">Muy activo</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button class="btn btn-cta" type="submit">Calcular</button>
                            <button id="resetBtn" type="button" class="btn btn-ghost">Limpiar</button>
                        </div>
                    </form>
                    <small class="d-block mt-2 small-muted">Resultados orientativos. Consulta con un profesional si
                        tienes
                        condiciones médicas.</small>
                </div>
            </div>

            <div class="col-lg-6" data-aos="fade-left">
                <div id="resultCard" class="result-card d-none" aria-live="polite">
                    <h6>Resultados</h6>
                    <p id="caloriesText" class="mb-2 small text-muted"></p>
                    <div id="macrosList" class="mb-3"></div>

                    <!--<h6>Plan de entrenamiento (ejemplo)</h6>
            <ul class="small mb-0">
              <li>Día 1: Full body (fuerza)</li>
              <li>Día 2: Cardio moderado</li>
              <li>Día 3: Tren superior (hipertrofia)</li>
              <li>Día 4: Descanso / movilidad</li>
              <li>Día 5: Tren inferior (fuerza)</li>
              <li>Día 6: HIIT corto</li>
              <li>Día 7: Recuperación</li>
            </ul>-->

                    <!-- Botón guardar: el JS también intentará crear uno si falta -->
                    <div class="mt-3">
                        <button type="button" class="btn btn-outline-dark btn-sm save-plan-btn"
                            aria-label="Guardar plan">Guardar plan</button>
                        <button type="button" class="btn btn-link btn-sm" data-bs-toggle="modal"
                            data-bs-target="#modalMyPlans">Ver mis planes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
